ones:
  base_url: ""
  token: ""
  project_uuid: ""

ai:
  model: claude-3-5-sonnet-latest

repo:
  # 测试用的一次性 mock 仓库，与项目根同级；由 `python tests/make_mock_repo.py`
  # 生成（也可在别处生成后用环境变量 MOCK_REPO 覆盖）。相对路径按项目根解析，
  # 所以用 `python run.py --config config.test.yaml` 从项目根运行即可。
  path: ../test-mock-repo
  branch: master

# deliberately empty -> exercises the degraded (layer 3) gate path
gate:
  degraded: true

playwright:
  base_url: http://localhost:3000
  headless: true
  screenshot_dir: ./screenshots

proposals:
  output_dir: ./proposals

knowledge_base:
  output_dir: ./knowledge_base
